name: 插件打包

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 构建并校验插件
        run: python scripts/build_plugin.py
      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: no-ai-slop-cn-plugin
          path: dist/no-ai-slop-cn-plugin-*.zip
      - name: 将插件包附加到 GitHub 发行版
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/no-ai-slop-cn-plugin-*.zip --generate-notes --verify-tag
